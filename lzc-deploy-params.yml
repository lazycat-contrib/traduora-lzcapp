params:
  - id: admin_email
    type: string
    name: Admin email
    description: "Email for the Traduora administrator account."
    default_value: "local.admin@ever.co"
    optional: false
  - id: admin_password
    type: secret
    name: Admin password
    description: "Password for the Traduora administrator, at least 12 characters. Upstream refuses publicly known passwords."
    default_value: "$random(len=20)"
    optional: false
locales:
  zh:
    admin_email:
      name: 管理员邮箱
      description: Traduora 管理员账号的邮箱。
    admin_password:
      name: 管理员密码
      description: Traduora 管理员登录密码，至少 12 位。默认随机生成；上游会拒绝已知的公开默认密码。
